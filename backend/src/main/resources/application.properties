spring.application.name=tayyar-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tayyar}
spring.datasource.username=${DB_USERNAME:tayyar_app}
spring.datasource.password=${DB_PASSWORD}
# PostgreSQL errors must not include submitted field values in application logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Explicit opt-in only after inspection of the target schema and grants.
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_IDLE_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.forward-headers-strategy=none
tayyar.identity.absolute-lifetime=${SESSION_ABSOLUTE_LIFETIME:12h}
tayyar.identity.login-limit=${AUTH_LOGIN_LIMIT:20}
tayyar.identity.registration-limit=${AUTH_REGISTRATION_LIMIT:5}
tayyar.identity.csrf-limit=${AUTH_CSRF_LIMIT:60}
