spring.application.name=tayyar-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tayyar}
spring.datasource.username=${DB_USERNAME:tayyar_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Explicit opt-in only after inspection of the target schema and grants.
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
