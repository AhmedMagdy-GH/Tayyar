name: tayyar-local

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_NAME: ${DB_NAME:-tayyar}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-tayyar_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}
      DB_USERNAME: ${DB_USERNAME:-tayyar_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores versioned data below this mount point.
      - tayyar-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: tayyar-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: container-local,migrate,container-migrate
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tayyar}
      DB_USERNAME: ${DB_USERNAME:-tayyar_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-tayyar_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  backend:
    image: tayyar-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    environment:
      SPRING_PROFILES_ACTIVE: container-local
      SERVER_PORT: ${CONTAINER_PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-tayyar}
      DB_USERNAME: ${DB_USERNAME:-tayyar_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ALLOWED_FRONTEND_ORIGINS: ${ALLOWED_FRONTEND_ORIGINS:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:${CONTAINER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          java -cp /opt/tayyar/health-probe HealthProbe
          http://127.0.0.1:$${SERVER_PORT:-8080}/actuator/health/readiness
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  tayyar-postgres-data:
